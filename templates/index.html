<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doge Coin Empire 🐕 - Мемный кликер-тайкун</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="stage-info">
                <div class="stage-name" id="stageName">🖥️ Домашний майнер</div>
                <div class="stage-desc" id="stageDesc">Майним на ноутбуке...</div>
            </div>
        </header>

        <main class="main">
            <div class="click-zone">
                <div class="doge-container" id="dogeContainer">
                    <div class="doge-emoji" id="dogeEmoji">🐕</div>
                    <div class="click-effect" id="clickEffect">+1</div>
                    <button class="doge-button" id="dogeButton">
                        <span>КЛИК!</span>
                    </button>
                </div>
                
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">🪙 DogeCoin</span>
                        <span class="stat-value" id="coins">0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">💰 Всего добыто</span>
                        <span class="stat-value" id="totalCoins">0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">👆 Кликов</span>
                        <span class="stat-value" id="clicks">0</span>
                    </div>
                </div>

                <div class="cps-display">
                    ⚡ Автоклик: <span id="autoClickPower">0.0</span> DogeCoin/сек
                </div>
            </div>

            <div class="upgrades-zone">
                <h2 class="upgrades-title">🛒 Магазин улучшений</h2>
                <div class="upgrades-grid" id="upgradesGrid"></div>
            </div>
        </main>

        <div class="events-panel" id="eventsPanel">
            <div class="event-toast" id="eventToast">
                <span class="event-icon"></span>
                <span class="event-text"></span>
            </div>
        </div>

        <footer class="footer">
            <button class="reset-btn" onclick="resetGame()">🔄 Начать заново</button>
            <span class="version">Doge Coin Empire v1.0 | Мемный кликер-тайкун</span>
        </footer>
    </div>

    <script src="/static/js/game.js"></script>
</body>
</html>
